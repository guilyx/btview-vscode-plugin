name: Feature Request
description: Suggest an improvement for BTView
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Graph editor / UX
        - BTCpp v3/v4 parsing
        - ROS includes
        - Documentation
        - Other
