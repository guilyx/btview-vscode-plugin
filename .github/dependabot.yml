version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Feature train lives on devel; main only receives release merges.
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Removed from the project (pre-commit replaces Husky + lint-staged)
      - dependency-name: husky
      - dependency-name: lint-staged
      # typescript-eslint supports TypeScript <6.1 only; revisit when it adds 7.x
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
