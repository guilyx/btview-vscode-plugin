name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  release:
    types: [published]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/ci-install.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  build:
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/ci-install.sh
      - run: npm run check-types
      - run: npm run compile
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:integration
      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npm run vsix

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/ci-install.sh
      - name: Verify version matches tag
        run: bash scripts/verify-release.sh "${{ github.ref_name }}"
      - run: npm run package
      - run: npm run vsix
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: '*.vsix'
          generate_release_notes: true
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --pat ${{ secrets.PAT_AZURE_MARKETPLACE }}
        env:
          VSCE_PAT: ${{ secrets.PAT_AZURE_MARKETPLACE }}
